<style>
:root{--bg:#faf5f7;--card:#fff;--ink:#0c2233;--mut:#586b7b;--line:#dbe5ee;--acc:#8a3b5c;--accfg:#fff;--sos:#d9482b;--soft:#e4eff6;--warn:#fff3df;color-scheme:light;

.back{background:none;border:0;color:var(--acc);font-weight:700;padding:8px 0;font-size:15px}

ul.l{margin:0;padding-left:20px}ul.l li{margin-bottom:6px}
.tag{display:inline-block;font-size:12px;background:var(--warn);border-radius:6px;padding:1px 8px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

label.c input{margin-top:5px;width:18px;height:18px;accent-color:var(--acc)}
.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.pr b{display:block;margin-bottom:2px}
.warn{background:var(--warn);border-radius:12px;padding:14px;margin-bottom:10px}

.", "혼자 짐을 지지 않는다."], "extra": false}], "myths": [{"title": "본능이면 충분하다", "body": "책은 사랑의 기술도 다른 모든 활동처럼 배움과 훈련이 필요하다고 봅니다. 고양이는 본능으로 새끼를 기르지만 인간 어머니는 양육을 배워야 한다는 비유를 들고, 문명사회에서는 오히려 이 지식이 수치심과 사사로운 수다 속에서 사라졌다고 지적합니다. 바이올린을 올바르게 잡아야 음악이 나오듯, 기초를 배워야 더 높은 기쁨에 이른다고 말합니다.", "ask": "나는 배우자와의 관계를 알려고 노력하고 있는가."}, {"title": "여성은 원래 변덕스럽다", "body": "책은 여성의 변덕이라 불리는 현상을 규칙을 모르는 데서 온 오해로 봅니다. 연구자와 기록자가 주로 남성이었고, 여성은 남성이 원하는 모습에 자신을 맞추며 살았다고 지적합니다. 바다가 물러났다고 변덕이라 하지 않는 것처럼, 여성의 리듬을 이해하려는 법칙 탐구가 필요하다는 입장입니다.", "ask": "배우자의 반응을 이해하려 하기 전에 먼저 평가하고 있지 않은가."}, {"title": "좋은 아내는 늘 응해야 한다", "body": "책은 법과 관습이 아내에게 늘 응할 의무를 부여해 온 것을 비판합니다. 이런 규칙적인 요구는 아내의 자연스러운 욕구의 곡선을 평평하게 만들고 열정이 줄어드는 원인이 되는 경우가 많다고 보며, 열정이 부족하다고 불평하는 남성이 그 원인을 자신에게서 찾아야 한다고 말합니다. 책은 원하지 않는 상대에게 권리를 주장하는 일을 폭력에 가까운 일로 봅니다.", "ask": "나는 권리가 아니라 상대의 마음을 기준으로 다가가는가."}, {"title": "여성에게는 스스로 생기는 욕구가 없다", "body": "책은 점잖은 사람들이 여성에게 자발적인 성적 충동이 없다고 생각하거나, 있는 여성을 타락했다고 보는 시각이 널리 퍼져 있다고 지적합니다. 저자는 많은 여성에게 직접 물어 이러한 생각이 사실과 다르다는 자료를 모았다고 말합니다. 책은 이것이 책의 관찰이라는 점을 전제로 읽어야 합니다.", "ask": "내가 가진 선입견이 상대를 침묵하게 하고 있지 않은가."}, {"title": "성관계는 자주 규칙적으로 할수록 좋다", "body": "책은 매일 밤처럼 규칙적이고 잦은 관계를 당연하게 생각하면 몇 분의 쾌락을 위해 끊임없이 확장되는 기쁨과 부드러움의 영역을 잃는다고 봅니다. 서로 원하는 시기를 살피는 편이 더 깊은 즐거움으로 이어진다는 입장이며, 횟수와 시기는 사람마다 다르다고 인정합니다.", "ask": "우리는 횟수보다 서로의 마음과 만족을 보고 있는가."}, {"title": "절제만 하면 해결된다", "body": "책은 남편이 성에 관한 책을 읽어도 절제의 기준이 저자마다 일주일에 세 번부터 한 달에 한 번까지 제각각이어서 합리적인 지침이 없다고 지적합니다. 책은 막연한 절제가 아니라 배우자의 리듬을 이해하고 관계를 맞추는 일이 더 중요하다고 봅니다. 한 시대의 평균 규칙을 절대적인 권리로 삼아서도 안 된다고 말합니다.", "ask": "나는 막연한 규칙보다 우리 부부의 상황을 보고 있는가."}, {"title": "발기하면 반드시 사정해야 한다", "body": "책은 발기가 정액이 쌓여서가 아니라 신경 반응으로 혈액이 몰려서 생기는 것이라고 설명하고, 따라서 사정 없이도 가라앉을 수 있다고 봅니다. 강한 의지와 정신적 안정으로 이를 조절할 수 있다고 말합니다. 이는 책의 설명이며 건강 문제는 의료 전문가와 상의하세요.", "ask": "내 욕구를 상대에게 부담으로 넘기고 있지 않은가."}, {"title": "과거의 경험이 기준이다", "body": "책은 과거 경험에서 본 반응을 기준 삼아 아내를 냉담하다고 판단하는 실수를 경계합니다. 그런 반응은 상대 남성의 기대에 맞추어 훈련된 것일 수 있어 서로의 진짜 마음을 이해하는 기준이 되지 못한다고 보며, 그런 방식으로는 상대에게서 자신의 모습만 보게 된다고 말합니다.", "ask": "나는 지금 눈앞의 사람을 보고 있는가."}, {"title": "성은 순수한 사람에게 어울리지 않는다", "body": "책은 여성이 성관계로 더러워진다는 생각이 초기 교회의 금욕적 이상과 여성을 도구로 사용해 온 관행에서 비롯되었다고 설명합니다. 이 때문에 사랑의 행위가 즐거워야 한다는 기본 사실조차 모르는 사람이 많다고 말합니다. 책은 사랑의 육체적 결합이 이해와 공감을 넓히는 길이라고 봅니다.", "ask": "나는 부끄러움 때문에 대화를 피하고 있지 않은가."}, {"title": "결혼이 문제이니 느슨하게 하거나 바꾸면 된다", "body": "책은 결혼의 속박이 아니라 지식 부족이 불만의 뿌리라고 보며, 한 파트너와 관계를 아름답게 만드는 법을 모르는 사람은 다른 파트너와도 성공하기 어렵다고 말합니다. 책은 결혼 안에서 사랑을 키우려는 노력을 사회에 이로운 일로 평가합니다.", "ask": "나는 관계를 바꾸기 전에 지금 관계에서 배운 것이 있는가."}], "gains": [{"title": "서로에게서 완전한 만족을 찾는 부부", "body": "책이 그리는 이상은 순결한 마음으로 결혼해 세월이 갈수록 사랑과 존경이 깊어지고 서로에게서 만족을 찾아 다른 누구도 바라지 않는 관계입니다. 책은 이를 위해 지식이 필요하다고 봅니다.", "line": "나는 이 사람과 함께 살며 점점 더 깊이 알아 가고 있다."}, {"title": "마음의 완전한 이해와 동료애", "body": "책은 모든 마음이 짝을 갈망하며, 짝은 내 영혼의 잠재력을 이해하고 나이 들어도 남아 있는 어린아이 같은 경이로움에 부드럽게 웃어 줄 수 있는 존재라고 말합니다. 숨길 것 없이 모든 것을 이야기할 수 있는 한 사람이 있다는 것이 영혼의 소중한 바람이라는 관점입니다.", "line": "나는 숨기지 않고 모든 것을 나눌 수 있는 사람이 있다."}, {"title": "서로의 건강과 활력", "body": "책은 남편이 아내의 리듬에 맞추어 자신을 조절하면 아내의 건강과 행복이 커지고 부부 관계에서 얻는 기쁨이 더 강해지며 자신의 활력과 자제력도 자란다고 봅니다. 이는 책의 관찰이며 사람마다 다릅니다.", "line": "나는 서로를 배려하며 함께 건강해지고 있다."}, {"title": "신뢰가 주는 자유", "body": "책은 서로 의심하지 않는 신뢰와 자유 속에서만 가장 완전한 사랑이 자랄 수 있고, 때로 떨어져 있는 시간이 영적 합일을 깊게 한다고 봅니다. 아름다움을 제대로 보려면 어느 정도 거리가 필요하다는 입장입니다.", "line": "우리는 각자의 시간 속에서도 서로를 믿는다."}, {"title": "아이의 탄생이 행복의 완성이 되는 부부", "body": "책은 서로에게 충분히 적응하고 완전한 사랑의 표현을 경험한 뒤 맞이하는 아이의 탄생은 행복에 대한 위험이 아니라 그 행복의 왕관이자 완성이 된다고 봅니다.", "line": "우리는 서로를 충분히 알아 간 뒤 아이를 맞이한다."}], "rules": [{"title": "각 관계는 다정한 구애로 시작한다", "body": "책이 남편에게 주는 최고의 법칙은 각 관계를 부드럽게 구애하여 얻고, 상대가 원하지 않거나 몸이 준비되지 않았다면 어떤 관계도 하지 않는 것입니다. 사랑은 사랑하는 사람에게 해를 끼치지 않는다는 말이 책의 불가침 법칙입니다."}, {"title": "상대를 관찰하고 맞춘다", "body": "책은 지속적이고 상호적인 행복을 원하는 사람이 배우자를 주의 깊게 연구해 그의 리듬과 독특한 개인적 특성을 파악하고, 자신의 요구를 상대의 본성에 맞추어야 한다고 말합니다. 각 부부는 결혼 후 자신들을 연구하고 두 사람 모두에게 가장 좋은 방식을 찾아야 합니다."}, {"title": "서로의 리듬 이해하기 (책의 관찰)", "body": "저자는 많은 여성의 이야기를 모아 여성의 욕구가 약 2주 주기로 월경 직전과 직후에 높아지는 경향이 있다고 봅니다. 한쪽 시기만 느끼는 여성도 있고 월경 중에 강한 여성도 정상 범위라고 말합니다. 이는 1900년대 초의 개인적 관찰이므로 모든 사람에게 적용되지 않으며, 우리 부부의 경험을 대화로 확인하는 용도로만 참고하세요."}, {"title": "책이 제안한 조정 (책의 관점)", "body": "책은 부부 관계의 최선의 조정을 사나흘 동안 관계를 갖고 이후 약 10일은 쉬는 형태로 봅니다. 12일에서 14일 정도의 절제는 건강한 남성에게 이점이 있다고 말하며, 아내의 욕구가 드물면 그 시기를 살펴 구애하라고 권합니다. 이는 책의 견해이며 사람마다 크게 다르다는 점도 책이 인정합니다."}, {"title": "썰물의 시기에는 마음으로 다가간다", "body": "책은 상대가 스스로 원하지 않는 시기에도 사랑하는 사람이 부드럽게 구애하면 그녀가 마음을 열 수 있다고 봅니다. 이때는 평소보다 더 강한 자극이 필요하고 육체적 접근보다 감정적, 영적 호소가 훨씬 중요하다고 말합니다."}, {"title": "충분한 준비와 시간", "body": "책은 준비가 되지 않은 상태에서 서두르면 고통과 반감을 줄 수 있고, 충분한 구애와 자극은 상대의 고통을 덜어줄 뿐 아니라 남성에게도 상호성에서 오는 큰 감각 증가를 준다고 봅니다. 여성이 준비되는 데에는 남성보다 시간이 더 걸릴 수 있어 남성이 자신의 반응을 조절하는 법을 배워야 한다고 말합니다."}, {"title": "서로의 반응을 맞춘다", "body": "책은 두 사람이 조화를 이룰 때 서로의 절정이 가까워지는 상호 만족이 매우 중요하다고 봅니다. 남성의 반응이 너무 빠르거나 서로의 조건이 맞지 않으면 여성이 이를 경험하지 못하는 경우가 많다고 말합니다. 책이 제시하는 수치는 당시 일부 계층에 대한 관찰이므로 참고만 하세요."}, {"title": "결혼 전 마음을 설명하고 결혼 후 함께 연구한다", "body": "책은 평생의 결합을 하기 전에 서로의 성적 감정에 대해 설명하여 나중의 속임수와 양립 불가능을 피하라고 말합니다. 각 부부는 가장 섬세한 손길로 서로를 탐색하고 시험하며 서로 마음의 복잡함으로 가는 길을 배워야 합니다."}, {"title": "절제 기간은 에너지를 돌리는 시간", "body": "책은 성의 창조적 에너지가 다른 활동으로 변환될 수 있다는 금욕주의자의 통찰을 결혼에서도 활용하라고 봅니다. 그러나 자연스러운 충동을 억제하는 데 너무 큰 에너지를 쓰고 일과 평정이 손상되는 것은 정당화되지 않는다고도 말합니다."}, {"title": "임신 시기를 함께 정한다", "body": "책은 첫 임신 전 적어도 6개월에서 1년 정도 서로를 알아 가는 시간을 갖는 것이 현명하다고 봅니다. 경제 사정이 어렵다면 아이를 미루는 편이 낫고, 일찍 아이를 갖는 것이 이상적이긴 하나 상황이 허락해야 한다고 말합니다. 이는 책의 견해이므로 임신 계획은 의료 전문가와 상담하세요."}, {"title": "출산 전후의 기간", "body": "책은 아이를 갖기 전 6개월 동안의 완전한 금욕은 지나치게 가혹하다고 보며, 출산 전후 각각 6주에서 2개월 정도의 절제로 충분하다고 말합니다. 첫 아이 출산 후 어머니와 아기의 건강을 위해 두 번째 아이는 최소 1년 뒤에 시작하는 것이 좋다고 봅니다. 의학적 판단은 전문가에게 확인하세요."}, {"title": "아플 때와 월경, 임신 중에는 배려한다", "body": "책은 한 시대의 평균 규칙을 절대적인 권리로 삼으면 안 된다고 말하며, 정상적인 남성은 아내가 아플 때뿐 아니라 월경과 임신 중에도 자제할 수 있고 그렇게 하는 것이 의무라고 봅니다."}, {"title": "다른 의견을 숨기지 않는다", "body": "책은 더 쉬운 길을 택해 서로의 견해를 숨기거나 강한 쪽이 약한 쪽을 강요하면 두 사람 모두와 그들이 지키려던 사랑이 빈약해진다고 봅니다. 상대의 다른 견해에서 아름다움과 존엄을 보려면 관대한 마음이 필요하고, 그 노력 자체가 가치 있다고 말합니다."}, {"title": "신뢰와 거리를 허용한다", "body": "책은 양쪽에 완전한 신뢰가 있어 혼자 여행하거나 방문하는 데 의심 없이 자유로워야 한다고 말합니다. 질투 어린 속박은 오히려 비밀스러운 일을 낳고, 신뢰받는 자유 속에서만 가장 완전한 사랑이 자란다고 봅니다. 때로는 떨어져 있는 시간이 서로의 아름다움을 더 잘 보게 한다고 말합니다."}, {"title": "책이 말하는 피임에 관한 견해 (참고)", "body": "책은 중단 성교나 콘돔 사용이 일부 여성에게 심한 괴로움을 준다고 말하며, 창조적인 힘을 아끼려는 사람에게는 권하지 않는다는 취지로 씁니다. 이는 오래된 견해이므로 피임 방법은 반드시 의료 전문가와 상담해 결정하세요."}], "stories": [{"title": "점점 멀어지는 선의의 남편", "body": "책이 소개하는 사례에서 성실하고 다정한 남편은 아내와 늘 함께하지만 몇 달 뒤부터 아내의 냉담과 이유 모를 눈물을 겪습니다. 며칠 사이 반응이 달라지자 그는 다른 남자가 있거나 아내가 변덕스럽다고 결론짓고 절제 서적만 뒤적입니다. 결국 서로 상처받습니다.", "line": "책은 이해하려는 선의만으로는 충분하지 않고 서로를 알 지식이 필요하다고 봅니다."}, {"title": "다정했지만 준비가 부족했던 부부", "body": "책이 소개하는 한 부부는 남편이 자주 아내를 안고 애정을 보였으나 아내의 마음을 열어 주는 데는 노력하지 않아 아내가 막연한 부족함을 느꼈습니다. 아내가 수줍게 부탁한 일도 한 번에 그치고 반복되지 않아 아내는 관계에서 즐거움을 거의 느끼지 못했습니다.", "line": "책은 부주의한 남편이 아내의 억눌린 아픔과 분노를 알아채지 못한다고 봅니다."}, {"title": "성에 대해 배우지 못한 신부", "body": "책은 결혼 적령기의 여성이 성에 대한 지식 없이 자랄 수 있다고 하며, 입맞춤만으로 임신할까 봐 몇 달간 불안해한 고등 교육을 받은 여성의 사례를 소개합니다. 그런 신부에게 즉시 결혼의 권리를 주장하는 것은 강간이라고 책은 말합니다.", "line": "책은 무지와 서두름이 평생의 상처가 될 수 있다고 봅니다."}, {"title": "과거 경험으로 아내를 오해한 남편", "body": "책은 진실하게 결혼한 남성도 과거에 돈으로 산 관계를 경험했다면 그 반응을 기준으로 아내를 냉담하다고 오해할 수 있다고 말합니다. 정신과 의사의 말을 빌려 그런 상대에게서 남성은 자신의 거울만 보게 된다고 설명합니다.", "line": "책은 비교가 아닌 이해가 관계의 시작이라고 봅니다."}, {"title": "괴로워한 아내와 변덕이라 생각한 남편", "body": "책이 소개하는 사례에서 아내는 남편을 열렬히 사랑하고 아이도 원했지만 마음이 채워지지 않아 마르고 신경질적으로 변했습니다. 남편은 이를 변덕스러운 고통이라 여겼습니다. 책은 동물에게도 짝짓기가 거부되면 심하게 괴로워하는 경우가 있다고 비유하며 더 진실한 관점으로 보기를 권합니다.", "line": "책은 말하지 못한 괴로움에 귀 기울이라고 말합니다."}, {"title": "일부다처가 아니라고 말한 남편들", "body": "책에는 아내가 즐기지 않는데도 관계를 계속할 수 없어 다른 곳으로 가게 된다는 젊은 남편의 말이 소개되며, 그는 결혼이 실패라고 단정합니다. 책은 대부분의 남성이 마음속으로는 일부다처를 원하지 않으며 지식이 부족해 오히려 마음이 갈망하는 것을 짓밟는다고 봅니다.", "line": "책은 결혼이 실패가 아니라 배움이 부족했던 것이라고 봅니다."}, {"title": "고대 전통에 담긴 지혜", "body": "책은 월경 후 일정 기간 관계를 하지 않는 오래된 유대 전통의 기간이 저자가 관찰한 여성의 욕구 주기와 거의 일치한다고 소개합니다. 이는 책의 해석이며 근거가 약할 수 있습니다.", "line": "책은 오랜 전통에도 관찰의 흔적이 있다고 봅니다."}], "checklist": ["지금 상대가 원하는지 말이나 표정으로 확인했는가", "서두르지 않고 충분히 다정한 시간을 보냈는가", "오늘 상대의 컨디션과 몸의 상태를 살폈는가", "거절이나 망설임을 서운함이 아닌 신호로 받아들일 수 있는가", "상대가 편안한지 아프지는 않은지 확인하고 있는가", "과거 경험이나 남의 이야기를 기준 삼아 상대를 평가하고 있지 않은가", "의심이나 서운함이 있다면 추측 대신 대화로 풀 준비가 되었는가", "통증, 두려움, 강압의 신호가 있으면 즉시 멈추기로 했는가", "임신과 피임에 대해 서로 같은 생각을 하고 있는가", "오늘 배우자에게 고마움을 한 번 표현했는가"], "logEnabled": true, "help": {"disclaimer": "이 앱은 책의 관점을 정리한 것이며 전문 상담·의료·법률 조언이 아닙니다. 책은 1900년대 초에 쓰였고 일부 설명은 오늘의 의학과 다를 수 있습니다.", "signalsTitle": "이런 경우에는 전문가를 만나세요", "signals": ["성관계 중 또는 이후 지속적인 통증, 출혈, 불편이 있을 때", "한쪽이 원하지 않는데 강요나 협박, 통제가 있을 때", "폭력이나 두려움을 느낄 때", "피임, 임신, 출산, 성 기능에 대해 의학적 확인이 필요할 때", "우울, 불안이 심하거나 일상이 어려울 때", "서로 대화가 되지 않고 갈등이 반복될 때"], "contactsTitle": "연락처", "contacts": [{"label": "긴급 신고", "value": "112", "tel": "112", "note": "폭력이나 위협 등 즉각적인 위험이 있을 때"}, {"label": "여성긴급전화", "value": "1366", "tel": "1366", "note": "가정폭력, 성폭력 등 피해 상담과 긴급 보호 연계"}, {"label": "정신건강 위기상담", "value": "109", "tel": "109", "note": "마음이 힘들 때 24시간 상담"}, {"label": "건강가정지원센터", "value": "1577-9337", "tel": "15779337", "note": "부부·가족 상담과 교육 안내"}], "closing": "혼자 감당하지 않아도 됩니다. 도움을 청하는 일도 관계를 지키는 방법입니다."}};

const day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const subs=()=>[["myths",L.myths],["gains",L.gains],["rules",L.rules]].filter(a=>A(a[0]).length);
const tabs=()=>[["today",L.today,"sun"],A("situations").length&&["sos",L.sos,"shield"],subs().length&&["learn",L.learn,"book"],(A("stories").length||C.logEnabled)&&["story",L.story,"note"],C.help&&["help",L.help,"buoy"]].filter(Boolean);
function today(){
 const d=day(),D=A("daily"),M=A("myths"),CK=A("checklist"),ck=JSON.parse(sg("ck","[]")),m=M.length?M[d%M.length]:null;
 return (D.length?`<div class="hero"><div class="lab">${esc(L.dailyLabel)}</div><p class="stmt">${esc(D[d%D.length])}</p></div>`:"")+
 (A("situations").length?`<button class="sit" data-go="sos"><span class="i">${ic("shield")}</span><span><b>${esc(L.sos)}</b><span class="mut">${esc(L.sosCta)}</span></span></button>`:"")+
 (m?`<h2>${esc(L.truthHeading)}</h2><div class="box"><b>${esc(m.title)}</b><p>${esc(m.body)}</p></div>`:"")+
 `<h2>${esc(L.pledgeHeading)}</h2><textarea id="pl" placeholder="${esc(L.pledgePlaceholder)}">${esc(sg("pl",""))}</textarea>`+
 (CK.length?`<h2>${esc(L.checklistHeading)}</h2>`+CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${esc(c)}</span></label>`).join("")+`<button class="back" id="rs">${esc(L.checklistReset)}</button>`:"");
}
function sos(){
 const S=A("situations");
 if(cur===null)return `<div class="hero"><div class="lab">${esc(L.sosLabel)}</div><h1>${esc(L.sosTitle)}</h1><p>${esc(L.sosText)}</p></div>`+
  S.map((s,n)=>`<button class="sit" data-n="${n}"><span class="i">${ic(s.icon)}</span><span><b>${esc(s.title)}</b><span class="mut">${esc(s.sub)}</span></span></button>`).join("")+(L.sosFooter?`<p class="mut">${esc(L.sosFooter)}</p>`:"");
 const s=S[cur],say=s.say||[],dos=s.do||[];
 return `<button class="back" id="bk">${esc(L.back)}</button><h1>${esc(s.title)}</h1>`+
 (s.book?`<h2>${esc(L.bookHeading)}</h2><div class="box">${esc(s.book)}</div>`:"")+
 (s.mind?`<h2>${esc(L.mindHeading)}</h2><div class="mind">“${esc(s.mind)}”</div>`:"")+
 (say.length?`<h2>${esc(L.sayHeading)}</h2>`+say.map(x=>`<div class="say">“${esc(x)}”</div>`).join(""):"")+
 (dos.length?`<h2>${esc(L.doHeading)}</h2>${s.extra?`<span class="tag">${esc(L.extraTag)}</span>`:""}<ul class="l">${dos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}
function myths(){return `<h1>${esc(L.mythsTitle)}</h1><p class="mut">${esc(L.mythsIntro)}</p>`+A("myths").map(m=>`<details class="my"><summary>${esc(m.title)}</summary><p>${esc(m.body)}</p>${m.ask?`<p class="mind" style="font-size:17px">${esc(L.askPrefix)}${esc(m.ask)}</p>`:""}</details>`).join("")}
function gains(){return `<h1>${esc(L.gainsTitle)}</h1><p class="mut">${esc(L.gainsIntro)}</p>`+A("gains").map(g=>`<div class="box"><b>${esc(g.title)}</b><p>${esc(g.body)}</p>${g.line?`<div class="mind" style="font-size:16px;margin:0">“${esc(g.line)}”</div>`:""}</div>`).join("")}
function rules(){return `<h1>${esc(L.rulesTitle)}</h1><p class="mut">${esc(L.rulesIntro)}</p>`+A("rules").map((p,n)=>`<div class="pr"><b>${n+1}. ${esc(p.title)}</b>${esc(p.body)}</div>`).join("")}
function learn(){
 const S=subs();if(!S.some(a=>a[0]===sub))sub=S[0][0];
 return (S.length>1?`<div class="seg">`+S.map(a=>`<button data-s="${a[0]}" aria-pressed="${sub===a[0]}">${esc(a[1])}</button>`).join("")+`</div>`:"")+{myths,gains,rules}[sub]();
}
function story(){
 const log=JSON.parse(sg("log","[]")),E=A("stories");
 return (E.length?`<h1>${esc(L.storyTitle)}</h1><p class="mut">${esc(L.storyIntro)}</p>`+E.map(e=>`<details class="my"><summary>${esc(e.title)}</summary><p>${esc(e.body)}</p>${e.line?`<p class="mind" style="font-size:17px">${esc(e.line)}</p>`:""}</details>`).join(""):"")+
 (C.logEnabled?`<h2>${esc(L.logTitle)}</h2><p class="mut">${esc(L.logIntro)}</p>
 <textarea id="ex" placeholder="${esc(L.logPlaceholder)}"></textarea>
 <button class="sit" id="ad" style="justify-content:center;margin-top:8px"><b>${esc(L.logAdd)}</b></button>`+
 log.map((l,n)=>`<div class="box"><span class="mut">${esc(l.d)}</span><p>${esc(l.t)}</p><button class="back" data-del="${n}">${esc(L.logDelete)}</button></div>`).join("")+
 (log.length?`<button class="back" id="cp">${esc(L.logCopy)}</button>`:"")+`<p class="mut">${esc(L.logNote)}</p>`:"");
}
function help(){
 const H=C.help||{};
 return `<h1>${esc(L.helpTitle)}</h1>`+(H.disclaimer?`<div class="warn"><b>${esc(H.disclaimer)}</b></div>`:"")+
 ((H.signals||[]).length?`<h2>${esc(H.signalsTitle||"")}</h2><ul class="l">${H.signals.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
 ((H.contacts||[]).length?`<h2>${esc(H.contactsTitle||"")}</h2>`+H.contacts.map(c=>`<div class="box">${esc(c.label)} ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.value)}</a>`:esc(c.value)}${c.note?`<br><span class="mut">${esc(c.note)}</span>`:""}</div>`).join(""):"")+
 (H.closing?`<p class="mut">${esc(H.closing)}</p>`:"");
}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
 if(!tabs().some(a=>a[0]===tab))tab="today";
 app.innerHTML={today,sos,learn,story,help}[tab]();
 nav.innerHTML=tabs().map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${ic(a[2],22)}<span>${esc(a[1])}</span></button>`).join("");
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 q(".sit[data-n]",b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 q("[data-go]",b=>b.onclick=()=>go(b.dataset.go));
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 q("[data-s]",b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 q("input[data-c]",i=>i.onchange=()=>{ss("ck",JSON.stringify([...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c)))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString(document.documentElement.lang||"ko"),t:v});ss("log",JSON.stringify(l));render()};
 q("[data-del]",b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent=L.logCopied})}catch(e){}};
}
render();
// 서비스 워커 등록 (오프라인 사용). https 또는 localhost에서만 동작합니다.
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
